# /etc/nginx/sites-available/shaxed.com  (then: ln -s it into sites-enabled, nginx -t, systemctl reload nginx)
# Swap shaxed.com for the real domain. Run `certbot --nginx -d shaxed.com -d www.shaxed.com` afterwards for HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name shaxed.com www.shaxed.com;

    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
