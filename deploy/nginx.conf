# /etc/nginx/sites-available/shaxed.com
#   sudo ln -s /etc/nginx/sites-available/shaxed.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Traffic path: visitor -> Cloudflare (proxied, SSL mode "Full (strict)") -> nginx :443 -> app on 127.0.0.1:3000.
# Port 80 on this VPS belongs to another container, so there is no :80 block and no certbot:
# Cloudflare's "Always Use HTTPS" handles http:// visits.
#
# Certificate: Cloudflare dashboard > SSL/TLS > Origin Server > Create Certificate
# for shaxed.com and *.shaxed.com, saved as the two files below (key chmod 600, owned by root).

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.shaxed.com;

  ssl_certificate     /etc/ssl/cloudflare/shaxed.com.pem;
  ssl_certificate_key /etc/ssl/cloudflare/shaxed.com.key;

  return 301 https://shaxed.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name shaxed.com;

  ssl_certificate     /etc/ssl/cloudflare/shaxed.com.pem;
  ssl_certificate_key /etc/ssl/cloudflare/shaxed.com.key;

  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app trusts one proxy hop. Pass the visitor's real address from Cloudflare,
    # not Cloudflare's own, so the admin login throttling counts per visitor.
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}
