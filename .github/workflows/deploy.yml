name: Deploy

# Deploys main to the VPS over SSH whenever main changes (a push or a merged PR).
# The SSH key's forced command on the server runs deploy/deploy.sh, whatever is sent.
# Needs these repository secrets (Settings > Secrets and variables > Actions);
# until they are all set the job skips itself:
#   VPS_HOST         the server's address
#   VPS_USER         the SSH user that owns ~/shaxed
#   VPS_SSH_KEY      private key whose public half is in that user's authorized_keys
#                    with command="<repo>/deploy/deploy.sh"
#   VPS_KNOWN_HOSTS  the server's host key line(s), so the connection is pinned
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets are not configured, skipping."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST"
